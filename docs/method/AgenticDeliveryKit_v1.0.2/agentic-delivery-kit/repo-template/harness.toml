# ---------------------------------------------------------------- traceability & tests ---
[traceability]
require = ["FR", "AS"]   # add "NFR" (and "SC") once you have tests for them
id_prefixes = ["FR", "NFR", "SC"]   # add e.g. "BR", "DR" if your requirements use those IDs
# test_globs = ["tests/**", "src/**/*.test.ts"]   # defaults cover common layouts

[tests]
acceptance_globs = ["tests/acceptance/**"]   # existing files here are protected from agent edits
# globs = ["tests/**", "**/*.test.*"]          # override test-file detection if needed

# ---------------------------------------------------------------- agent policy -----------
[agent_policy]
ask_on_dependency_add = true          # npm/pip/uv/dotnet/cargo/go adds need human approval
protected_paths = []                  # extra globs agents may not edit without approval
secret_paths = []                     # extra globs agents may never read (e.g. config exports with credentials)
extra_deny_patterns = []              # extra regexes for shell commands to block
extra_ask_patterns = []               # extra regexes for shell commands needing approval

# ---------------------------------------------------------------- stack cheat-sheet -------
# Node/TS : prettier --check . | eslint . --max-warnings=0 | tsc --noEmit | vitest run | playwright test | depcruise src
# Python  : ruff format --check . | ruff check . | mypy src | pytest -q | lint-imports (import-linter)
# .NET    : dotnet format --verify-no-changes | dotnet build -warnaserror | dotnet test | NetArchTest/ArchUnitNET in tests
# Java    : ./mvnw -q verify (run_windows = "mvnw.cmd -q verify") | ./gradlew check | ArchUnit in tests
# Mutation testing is slow - schedule it weekly (Stryker for JS/TS/C#, PIT for Java, mutmut for Python), not here.

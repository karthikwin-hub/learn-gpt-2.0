# harness.toml - this repository's computational sensors and agent policy
# Agentic Delivery Standard v1.0 · tier: SEED (project-owned: fill in once, keep current)
#
# `python scripts/harness/verify.py`        runs every enabled [[check]]  (before "done", in CI)
# `python scripts/harness/verify.py --fast` runs only checks with fast = true (agent inner loop)
# Agents run ONLY these commands to prove their work, so keep them real and fast.
# "{python}" is replaced with the current Python interpreter (works on Windows and Linux).
# A run value starting with TODO counts as NOT CONFIGURED and fails verification on purpose.
#
# Per check: name, run, fast (bool), timeout (s, default 900), hint (shown on failure),
#            run_windows (optional Windows-specific command), when (globs: run only if matching
#            files changed), allow_failure (bool: report as WARN), enabled (bool).

[verify]
stop_guard = true          # agents cannot finish while code changed since the last passing verify
stop_guard_stage = "fast"  # "fast" or "full": what the stop guard requires
non_code_globs = ["**/*.md", "docs/**", "specs/**", ".specify/**", ".agent/**"]

# ---------------------------------------------------------------- fast (inner loop) -----
[[check]]
name = "format"
run = "TODO e.g. npx prettier --check .   |  ruff format --check .  |  dotnet format --verify-no-changes"
fast = true
hint = "Run the formatter in write mode, then re-run verify. Never hand-format around the formatter."

[[check]]
name = "lint"
run = "TODO e.g. npx eslint . --max-warnings=0  |  ruff check .  |  dotnet build -warnaserror"
fast = true
hint = "Fix the rule violation. Do not disable a rule inline unless the PR explains why."

[[check]]
name = "typecheck"
run = "TODO e.g. npx tsc --noEmit  |  mypy src  |  pyright   (set enabled = false if not applicable)"
fast = true

[[check]]
name = "unit-tests"
run = "TODO e.g. npx vitest run  |  pytest -q tests/unit  |  dotnet test --filter Category!=Acceptance"
fast = true
timeout = 900
hint = "A failing test is information. Fix the code, not the test - unless the test is provably wrong (then ask)."

# ---------------------------------------------------------------- full only -------------
[[check]]
name = "acceptance-tests"
run = "TODO e.g. npx vitest run tests/acceptance  |  pytest -q tests/acceptance  |  npx playwright test"
fast = false
timeout = 1800
hint = "Acceptance tests encode the spec owner's scenarios (US<n>-AS<m>). They are the contract - do not edit them to pass."

[[check]]
name = "architecture-rules"
run = "TODO e.g. npx depcruise src  |  lint-imports  |  (ArchUnit/NetArchTest run with unit tests -> enabled = false)"
fast = false
hint = "A module depends on something it must not (docs/ARCHITECTURE.md). Move the logic to its owning module instead of adding the import."

[[check]]
name = "traceability"
run = "{python} scripts/harness/check_traceability.py --write"
fast = false
hint = "Every FR-### and acceptance scenario needs a test that names its ID (or [VERIFY: manual] + evidence in checks.md)."

[[check]]
name = "test-integrity"
run = "{python} scripts/harness/check_test_integrity.py"
fast = false
hint = "Tests, skips or acceptance criteria were weakened. Restore them and fix the code, or ask a human to approve."


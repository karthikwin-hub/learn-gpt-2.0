<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <title>Gurukul</title>
    <link rel="stylesheet" href="/src/ui/components/theme/tokens.css" />
    <link rel="stylesheet" href="/src/ui/components/theme/shell.css" />
  </head>
  <body>
    <div id="app" class="screen-frame" data-app-ready="true">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="btn-back" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
        </button>
        <h1 class="topbar-title" id="topbar-title">Gurukul</h1>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"
            />
          </svg>
        </button>
        <button class="icon-btn lang-btn" id="btn-lang" type="button" aria-label="Choose language">
          <span id="lang-glyph">A</span>
        </button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div id="modal-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
